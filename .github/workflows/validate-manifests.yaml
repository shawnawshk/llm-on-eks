name: Validate manifests

on:
  push:
    branches: [main]
    paths: ['**/*.yaml', '**/*.yml']
  pull_request:
    paths: ['**/*.yaml', '**/*.yml']

jobs:
  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Render placeholders
        run: |
          # manifests ship with <ACCOUNT_ID>/<REGION> placeholders; substitute
          # dummies so YAML parses
          mkdir -p /tmp/rendered
          find k8s-manifest -name '*.yaml' -exec cp --parents {} /tmp/rendered \;
          cp nodepool.yaml open-webui.yaml /tmp/rendered/
          find /tmp/rendered -name '*.yaml' \
            -exec sed -i 's|<ACCOUNT_ID>|000000000000|g; s|<REGION>|us-west-2|g' {} +

      - name: kubeconform
        run: |
          # LeaderWorkerSet and Karpenter are CRDs — validate against the CRD
          # catalog; skip kinds with no published schema
          kubeconform -summary -strict \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas \
            /tmp/rendered
